.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.hero .big{font-size:76px;line-height:1}.hero .row{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat b{font:700 34px "Barlow Condensed",sans-serif;display:block}
.cv{position:relative;height:240px;width:100%}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:8px 0}
